<!doctype html><meta charset="utf-8"><title>Arcane Depths art review</title>
<style>
body{margin:0;background:#07060c;color:#dbc791;font:13px Georgia}
nav{padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
nav b{color:#a78bfa;margin-right:4px}
button{background:#1a1726;color:#e9d5ff;border:1px solid #4c3d6b;padding:5px 9px;cursor:pointer;font:12px Georgia}
button.on{background:#4c1d95;border-color:#c4b5fd}
canvas{width:min(100%,1024px);display:block;margin:0 10px}
#label{padding:4px 12px;color:#fde68a}
</style>
<nav id="modes"><b>view</b></nav>
<nav id="ids"></nav>
<nav id="opts"></nav>
<div id="label"></div>
<canvas id="c" width="1024" height="640"></canvas>
<script>const state={pos:{x:512,y:540},appearance:{}};</script>
<script src="../../js/vendor/three.min.js"></script>
<script src="../../js/shared/economy.js"></script>
<script src="../../js/shared/depths.js"></script>
<script src="../../js/shared/dungeon.js"></script>
<script src="../../js/graphics.js"></script>
<script src="../../js/mobs.js"></script>
<script src="../../js/dungeon3d.js"></script>
<script src="../../js/bosses.js"></script>
<script>
/* Static review of every Arcane Depths visual. URL hash drives it so a frame
   can be linked / screenshotted directly, e.g.
   #mode=boss&id=astraea&phase=2      #mode=cine&id=khyra&cmode=entrance&k=0.8
   #mode=enemies&theme=geode          #mode=attack&id=sigils   #mode=loot
   #mode=dungeon&theme=crypt&endless=12   (an Arcane Depths floor echoing the Crypt, 12 floors down)
   #mode=loot&lootAge=900                  (the Arcane Surge frozen 900ms after the drop)  */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const NEW_BOSSES=['astraea','khyra','iskarra','heart','concordant','curator','prismgolem','halvard','herald','broodmother','ley_ember','ley_tide','ley_star'];
const OLD_BOSSES=['warden','smith','tyrant','dragon','ogrelord','tempest'];
const THEMES=['crypt','forge','void','dragon','archive','geode','rime','depths','nexus','warpit','belfry','nest'];
// the three mini chambers (Ogre Lord, Herald, Broodmother) are arena themes only: dungeon/enemy views fall back to their tier's floor
const SHAPES=['constellation','lance','twin_lance','sigils','quad_sigils','spiral','hazard','collapse','summon','ward','soak','ring3','push'];
const P=Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
let mode=P.mode||'boss',id=P.id||'astraea',phase=+(P.phase||1),theme=P.theme||'archive',cmode=P.cmode||'entrance',k=P.k!=null?+P.k:.85;
function setEndless(Q){if(Q.endless)state.dungeon={endless:true,depth:+Q.endless};else delete state.dungeon;}
setEndless(P);
let st={broken:P.broken==='1',dead:P.dead==='1',enrage:P.enrage==='1',ward:P.ward==='1',rising:0,playing:P.play==='1',freeze:P.freeze!=null?+P.freeze:null};
function btn(parent,text,on,fn){const b=document.createElement('button');b.textContent=text;if(on)b.className='on';b.onclick=fn;parent.append(b);return b;}
function setHash(){location.hash=new URLSearchParams(Object.assign({mode,id,phase,theme,cmode,k},st.broken?{broken:1}:{},st.dead?{dead:1}:{},st.enrage?{enrage:1}:{},st.ward?{ward:1}:{})).toString();build();}
function build(){
  const M=document.getElementById('modes');M.innerHTML='<b>view</b>';
  for(const m of ['boss','cine','attack','arena','enemies','dungeon','loot','cosmetics'])btn(M,m,m===mode,()=>{mode=m;setHash();});
  const I=document.getElementById('ids');I.innerHTML='';const O=document.getElementById('opts');O.innerHTML='';
  if(mode==='boss'||mode==='cine'){
    for(const b of NEW_BOSSES.concat(OLD_BOSSES))btn(I,b,b===id,()=>{id=b;phase=1;setHash();});
    const n=ECON.bossPhaseCount(id);
    if(mode==='boss'){for(let p=1;p<=n;p++)btn(O,'phase '+p,p===phase,()=>{phase=p;setHash();});
      btn(O,'broken parts',st.broken,()=>{st.broken=!st.broken;setHash();});btn(O,'dead',st.dead,()=>{st.dead=!st.dead;setHash();});
      btn(O,'enrage',st.enrage,()=>{st.enrage=!st.enrage;setHash();});btn(O,'ward',st.ward,()=>{st.ward=!st.ward;setHash();});
      btn(O,'phase shift ▶',false,()=>{shift=gameBosses.startPhaseShift({id,phase:Math.max(2,phase)});});
      btn(O,'rise ▶',false,()=>{st.rising=Date.now();});}
    else{for(const m of ['entrance','victory','phase2'])btn(O,m,m===cmode,()=>{cmode=m;setHash();});
      for(const kk of [.15,.3,.45,.6,.75,.85,.95,1])btn(O,'k '+kk,Math.abs(kk-k)<1e-3,()=>{k=kk;st.playing=false;setHash();});
      btn(O,'play ▶',st.playing,()=>{st.playing=true;k=0;scene++;});}
  }else if(mode==='attack'){for(const s of SHAPES)btn(I,s,s===id,()=>{id=s;setHash();});}
  else if(mode==='arena'||mode==='enemies'||mode==='dungeon'){for(const t of THEMES)btn(I,t,t===theme,()=>{theme=t;setHash();});}
}
let shift=null,scene=1,prev=0;
function mkBoss(t){
  const def=ECON.GUILD_BOSSES[id];const nParts=def.parts;
  const parts=Array.from({length:nParts},(_,i)=>({hp:st.broken&&i%2===0?0:(st.broken?40:100),maxHp:100}));
  if(def.pylons)for(let i=0;i<4;i++)parts.push({hp:i===1?0:70,maxHp:100,pylon:true});
  const b={id,status:st.dead?'dead':st.rising?'rising':'alive',phase,parts,mini:def.tier==='mini',hardEnraged:st.enrage,wardUntil:st.ward?t+1e5:0,
    pylonShield:!!def.pylons&&phase===2,addsShield:id==='khyra'&&phase===2,adds:[{hp:10}],_t0:st.rising||t,_deadAt:t-500,riseMs:ECON.GUILD_BOSS.RISE_MS};
  return b;
}
function shot(type,t){
  const W=1024,H=640,head={x:512,y:218},now=t;
  const base={type,warnMs:2000,fireAt:now+800,durMs:2400,dmg:10,head,tell:type.toUpperCase(),dodge:'how to dodge it',points:[{x:420,y:470}]};
  const phaseK=((t/4000)%1),live=Object.assign({},base,{fireAt:now+2000-phaseK*4000});
  const a=live;
  if(type==='constellation'){a.stars=[{x:300,y:420},{x:470,y:520},{x:640,y:380},{x:790,y:500},{x:560,y:300},{x:380,y:300}];a.w=34;a.durMs=900;}
  if(type==='lance'||type==='twin_lance'){a.type='lance';a.len=900;a.w=50;a.ang=1.1+Math.sin(t/900)*0.6;a.beams=type==='twin_lance'?2:1;a.durMs=3000;}
  if(type==='sigils'||type==='quad_sigils'){a.type='sigils';a.r=62;a.circles=[];
    if(type==='sigils'){for(let i=0;i<5;i++){const an=i/5*Math.PI*2;a.circles.push({x:512+Math.cos(an)*300,y:360+Math.sin(an)*150});}a.answer=2;}
    else{a.perQuadrant=true;a.answers=[1,0,2,1];for(let q=0;q<4;q++)for(let j=0;j<3;j++)a.circles.push({x:(q%2?560:90)+j*120+60,y:q<2?170+j*20:420+j*20,q});}}
  if(type==='spiral'){a.r=40;a.points=[];for(let arm=0;arm<3;arm++)for(let j=0;j<12;j++){const u=j/12,an=arm*2.09+u*6;a.points.push({x:512+Math.cos(an)*u*420,y:300+Math.sin(an)*u*240,at:a.fireAt+u*2200});}}
  if(type==='hazard'){a.r=74;a.lingerMs=6000;a.points=[{x:360,y:450},{x:560,y:520},{x:700,y:400}];a.fireAt=now-1200;}
  if(type==='collapse'){a.rStart=520;a.rEnd=150;a.durMs=4000;a.fireAt=now-((t/3)%4000);}
  if(type==='summon'){a.adds=[{x:300,y:360},{x:512,y:420},{x:724,y:360}];}
  if(type==='ward'){a.durMs=2500;}
  if(type==='soak'){a.spot={x:512,y:460};a.r=110;a.need=3;a.inside=Math.floor(t/800)%4;}
  if(type==='ring3'){a.type='ring';a.r=560;a.band=56;a.count=3;a.gapMs=460;a.durMs=1500;a.fireAt=now-((t/2)%3000);}
  if(type==='push'){a.type='whirlpool';a.pull=-1.8;}
  if(P.at!=null){const at=+P.at,life=a.lingerMs||((a.durMs||900)+((a.count||1)-1)*(a.gapMs||0));a.fireAt=at<=1?now+a.warnMs*(1-at):now-(at-1)*life;
    if(a.points)for(const pt of a.points)if(pt.at!=null)pt.at=a.fireAt+(pt.at-live.fireAt);}
  return a;
}
function drawShowcaseEnemies(t){
  const TY=DUNGEON.ENEMY_TYPES,list=['wisp','tome','scribe','sentinel','crawler','shard','prism','golem','wraith','angler','revenant','mimic','goblin','voidling'];
  ctx.fillStyle='#0b0a12';ctx.fillRect(0,0,1024,640);
  gameMobs.drawFloor(ctx,0,0,1024,640,theme);
  const elites=P.elites==='1',Z=+(P.zoom||(elites?1.7:2.2));
  ctx.save();ctx.scale(Z,Z);
  if(!elites)list.forEach((ty,i)=>{const T=TY[ty],col=i%7,row=Math.floor(i/7);
    const x=(84+col*140)/Z,y=(170+row*260)/Z;
    const e=showcase[ty]||(showcase[ty]={id:ty,type:ty,x,y,color:T.color,size:T.size,hp:T.hp*0.7,maxHp:T.hp,ai:T.ai,awake:true,name:T.name});
    e.x=x+Math.sin(t/900+i)*4;e.y=y;e.awake=ty!=='mimic'||Math.floor(t/3000)%2===0;
    gameMobs.drawEnemy(ctx,e,t,TY);ctx.fillStyle='#e9d5ff';ctx.font='6px Georgia';ctx.textAlign='center';ctx.fillText(T.name,x,y+30);});
  else Object.keys(DEPTHS.ELITE_AFFIXES).forEach((af,i)=>{const e=showcase['el'+af]||(showcase['el'+af]={type:['golem','wraith','sentinel','crawler','revenant','tome','angler','wisp','scribe'][i],x:0,y:0,color:'#888',size:15,hp:60,maxHp:100,awake:true,elite:i<6?1:2,affixes:i<6?[af]:[af,'frenzied'],shield:af==='shielded'?30:0,shieldMax:af==='shielded'?40:0,empowered:i===8?50:0,name:(DEPTHS.ELITE_AFFIXES[af].name)+' '+(i<6?'Elite':'Champion')});
    const T=DUNGEON.ENEMY_TYPES[e.type];e.color=T.color;e.size=T.size*(e.elite===2?1.4:1.25);e.x=(90+(i%5)*200)/Z+Math.sin(t/700+i)*6;e.y=(190+Math.floor(i/5)*270)/Z;
    gameMobs.drawEnemy(ctx,e,t,TY);});
  ctx.restore();
}
const showcase={};
function frame(now){
  const t=Date.now();
  try{
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  let label='';
  if(mode==='boss'){
    if(!ECON.GUILD_BOSSES[id]){id='astraea';}
    const b=mkBoss(t);
    if(!gameBosses.drawArena(ctx,id,t)){ctx.fillStyle='#140d18';ctx.fillRect(0,0,1024,640);}
    gameBosses.drawBoss(ctx,b,t);
    if(P.shift!=null&&!shift){const s0=gameBosses.startPhaseShift({id,phase:Math.max(2,phase)});s0.t0=t-s0.dur*(+P.shift);gameBosses.drawPhaseShift(ctx,s0,b,t);}
    if(shift){gameBosses.drawPhaseShift(ctx,shift,b,t);if(t-shift.t0>shift.dur)shift=null;}
    const look=ECON.bossLook(id,phase);label=look.name+' · phase '+phase+'/'+ECON.bossPhaseCount(id)+(gameBosses.hasRenderer(id)?'':' (FALLBACK)');
  }else if(mode==='cine'){
    const def=ECON.GUILD_BOSSES[id];
    const dur=cmode==='victory'?6000:cmode==='phase2'?(ECON.bossPhases(def)[0]||{}).shiftMs||12000:def.tier==='mini'?ECON.GUILD_BOSS.MINI_RISE_MS:ECON.GUILD_BOSS.RISE_MS;
    if(st.playing&&prev)k=Math.min(1,k+(now-prev)/dur);prev=now;
    const look=cmode==='phase2'?ECON.bossLook(id,2):def;
    const img=DungeonGL.render({mode:cmode,id,k,t:now,sceneId:scene+cmode+id,mini:def.tier==='mini'&&cmode!=='phase2',color:look.color,accent:look.accent,phase:2});
    if(img)ctx.drawImage(img,0,0,1024,640);else{ctx.fillStyle='#300';ctx.fillRect(0,0,1024,640);}
    label=(img?'':'RENDER FAILED · ')+def.name+' · '+cmode+' · '+Math.round(k*100)+'%';
  }else if(mode==='attack'){
    if(!SHAPES.includes(id))id='constellation';
    gameBosses.drawArena(ctx,id==='soak'||id==='ring3'?'nexus':id==='hazard'?'rime':'archive',t);
    const b={id:'astraea',status:'alive',phase:1,parts:Array.from({length:7},()=>({hp:100,maxHp:100})),_t0:t};
    gameBosses.drawBoss(ctx,b,t);
    const a=shot(id,t);
    gameBosses.drawAttacks(ctx,[a],t,ECON.GUILD_BOSSES.astraea);
    label='attack · '+id+' · '+(a.fireAt>t?'winding':'firing');
  }else if(mode==='arena'){
    if(!gameBosses.drawArena(ctx,theme,t)){ctx.fillStyle='#140d18';ctx.fillRect(0,0,1024,640);label='(old tiers keep combat.js room) ';}
    label+='arena · '+theme;
  }else if(mode==='enemies'){drawShowcaseEnemies(t);label='enemies on '+theme+' floor';}
  else if(mode==='dungeon'){
    ctx.fillStyle='#000';ctx.fillRect(0,0,1024,640);
    gameMobs.drawFloor(ctx,0,0,1024,640,theme);
    const walls=[{x:0,y:0,w:1024,h:24},{x:0,y:0,w:24,h:640},{x:1000,y:0,w:24,h:640},{x:0,y:616,w:1024,h:24},{x:300,y:200,w:24,h:260},{x:600,y:120,w:260,h:24},{x:640,y:420,w:24,h:196}];
    gameMobs.drawWalls(ctx,walls,theme);
    const T=DEPTHS.themeFor(theme);const props=[];
    const kinds=(T&&T.props)||[];kinds.forEach((kk,i)=>{props.push({kind:kk,x:140+i*190,y:340,rot:.4,ph:i});props.push({kind:kk,x:220+i*150,y:540,rot:1.2,ph:i+2});});
    props.push({kind:'torch',x:80,y:120,ph:0},{kind:'torch',x:940,y:120,ph:1});
    gameMobs.drawGroundProps(ctx,props,t);gameMobs.drawStandingProps(ctx,props,t,theme);
    gameMobs.drawDarkness(ctx,state.pos.x,state.pos.y,0,0,1024,640,theme);
    if(gameMobs.drawMotes)gameMobs.drawMotes(ctx,0,0,1024,640,t,theme);
    label='dungeon · '+theme+(state.dungeon?' · ARCANE DEPTHS floor '+state.dungeon.depth+' (echo)':'')+' · props: '+kinds.join(', ');
  }else if(mode==='loot'){
    gameBosses.drawArena(ctx,'depths',t);ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,1024,640);
    const R=ECON.GEAR_RARITIES;R.forEach((r,i)=>{const x=80+i*123;gameBosses.drawLootBeam(ctx,x,250,r,t,{t0:r==='arcane'?t-(P.lootAge!=null?+P.lootAge:(t%5000)):t-5000,label:r==='arcane'});gameBosses.drawRarityGlow(ctx,x,250,14,r,t);ctx.fillStyle=ECON.GEAR_RARITY_INFO[r].color;ctx.font='12px Georgia';ctx.textAlign='center';ctx.fillText(r,x,280);});
    [0,1,2,3].forEach(i=>{gameBosses.drawChestTier(ctx,90+i*120,390,i,i===3?((t%6000)/3000):null);});
    const feats=['shrine:fury','shrine:haste','shrine:warding','shrine:renewal','shrine:fortune','shrine:sight','chest:plain','chest:silver','chest:gold','chest:trial','chest:cache','chest:vault','key:silver','key:gold','key:shard','star','portal','pylon','rift_stair'];
    feats.forEach((f,i)=>{const x=580+(i%7)*66,y=360+Math.floor(i/7)*95;ctx.save();ctx.translate(x,y);ctx.scale(.62,.62);gameBosses.drawFeature(ctx,f,0,0,t,{hp:70,maxHp:100});ctx.restore();});
    gameBosses.drawFeature(ctx,'vault_door',0,0,t,{rect:{x:40,y:560,w:200,h:28},have:2,need:3});
    gameBosses.drawFeature(ctx,'trial_door',0,0,t,{rect:{x:280,y:560,w:200,h:28}});
    gameBosses.drawFeature(ctx,'secret_hint',0,0,t,{rect:{x:520,y:560,w:120,h:28}});
    gameBosses.drawFeature(ctx,'sanctuary',860,560,t,{r:90});
    label='loot beams · chest tiers · run features';
  }else if(mode==='cosmetics'){
    ctx.fillStyle='#1b1a24';ctx.fillRect(0,0,1024,640);
    const C=ECON.COSMETICS;const items=[];
    for(const a of ['lantern','arcane_halo','starfall','concord_banner'])items.push({aura:a,label:'aura '+a});
    for(const p of ['wisp','void_kitten'])items.push({pet:p,label:'pet '+p});
    for(const h of ['drowned_crown_hat','forgemaster_goggles','hollow_diadem_hat','ember_crown','star_circlet','geode_tiara','rime_crown'])items.push({hat:h,label:h});
    items.push({nameColor:'arcane',label:'name arcane'});
    items.forEach((it,i)=>{const x=90+(i%7)*140,y=150+Math.floor(i/7)*220;ctx.save();ctx.translate(x,y);ctx.scale(2.4,2.4);
      GFX.drawCharacter(ctx,0,0,Object.assign({shirt:'#334155',pants:'#1e293b'},it),{facing:'down'});
      if(it.nameColor)GFX.drawNameAndBubble(ctx,0,0,'Delver',[],false,it,null);
      ctx.restore();ctx.fillStyle='#e9d5ff';ctx.font='12px Georgia';ctx.textAlign='center';ctx.fillText(it.label,x,y+70);});
    label='cosmetics';
  }
  document.getElementById('label').textContent=label;
  }catch(e){document.getElementById('label').textContent='ERROR '+e.stack;console.error(e);}
  requestAnimationFrame(frame);
}
build();requestAnimationFrame(frame);
window.addEventListener('hashchange',()=>{const Q=Object.fromEntries(new URLSearchParams(location.hash.slice(1)));setEndless(Q);P.lootAge=Q.lootAge;mode=Q.mode||mode;id=Q.id||id;phase=+(Q.phase||phase);theme=Q.theme||theme;cmode=Q.cmode||cmode;if(Q.k!=null)k=+Q.k;build();});
</script>
