  <!-- LOGIN SCREEN: a flight through the town (js/neighborhood-title.js draws it on #titleBg) -->
  <div id="loginScreen" class="screen nb-login">
    <canvas id="titleBg" aria-hidden="true"></canvas>
    <div class="nb-rays" aria-hidden="true"></div>
    <div class="nb-shade" aria-hidden="true"></div>
    <main class="nb-stack">
      <h1 class="nb-title" aria-label="Neighborhood"><i style="--i:0">N</i><i style="--i:1">E</i><i style="--i:2">I</i><i style="--i:3">G</i><i style="--i:4">H</i><i style="--i:5">B</i><i style="--i:6">O</i><i style="--i:7">R</i><i style="--i:8">H</i><i style="--i:9">O</i><i style="--i:10">O</i><i style="--i:11">D</i></h1>
      <form class="nb-panel" onsubmit="return false" autocomplete="on">
        <input id="loginUser" placeholder="Username" maxlength="16" autocomplete="username" />
        <input id="loginPass" type="password" placeholder="Password" maxlength="32" autocomplete="current-password" />
        <div class="nb-btns">
          <button id="btnLogin" type="button">Log In</button>
          <button id="btnRegister" type="button">Register</button>
        </div>
        <div id="loginMsg" class="msg"></div>
      </form>
    </main>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="screen hidden">
   <div id="stage">
    <canvas id="game" width="1280" height="800"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="hudRow"><span id="hudName">—</span></div>
      <div class="hudRow"><span class="hudIcon money">$</span><span id="hudMoney">0</span></div>
      <div class="hudRow muted" id="hudBankRow" style="display:none;"><span class="hudIcon" style="background:#4ade80;color:#06210f">🏦</span><span id="hudBank">0</span></div>
      <div class="hudRow" id="hudDebtRow" style="display:none;color:#f87171;"><span class="hudIcon" style="background:#ef4444;color:#fff">!</span>owe <span id="hudDebt">0</span></div>
      <div class="hudRow"><span class="hudIcon hp">+</span><span id="hudHp">100</span></div>
      <div class="hudRow" id="hudLuckRow" style="display:none;color:#4ade80;font-weight:700;" title="Luck from a cooked meal: rarer fish and better VEGAS payouts"><span class="hudIcon" style="background:#22c55e;color:#052e16">🍀</span><span id="hudLuck"></span></div>
      <div class="hudRow" id="hudInvis" style="display:none;color:#a78bfa;font-weight:700;">👻 INVISIBLE <small style="color:#8aa0bf;font-weight:400;">(V)</small></div>
      <div class="hudRow muted" id="hudArea">Neighborhood</div>
    </div>

    <!-- PHONE — the action bar lives on a GTA-style phone in the corner.
         Apps open INSIDE the phone screen (#phoneAppView); the ⤢ button blows
         the whole phone up to the middle of the screen and back. -->
    <div id="phone">
      <div class="phoneBody">
        <div class="phoneNotch"></div>
        <div class="phoneScreen">
          <div class="phoneStatus">
            <span class="sig">▂▄▆ NBHD</span>
            <span id="phoneClock">12:00</span>
            <span class="statRight">
              <button id="phoneExpand" title="Expand / shrink phone">⤢</button>
              <span class="bat">🔋</span>
            </span>
          </div>
          <div id="phoneHomeView">
            <div class="phoneHero">
              <div id="phoneBigClock">12:00</div>
              <div id="phoneDate">Tuesday</div>
            </div>
            <button type="button" class="actBtn phoneBanner" id="phoneRaceBanner" data-act="race-qualifier" aria-label="The Apex League Tournament Open Qualifiers">
              <span class="phoneBannerTitle">The Apex League Tournament Open Qualifiers</span>
              <span class="phoneBannerMeta"><span id="phoneRaceEnds">Ends September 24, 2026, 2:17 PM</span> · <span id="phoneRaceCountdown">—</span></span>
              <span class="phoneBannerBoard" id="phoneRaceBoard">Top 10 · tap to race</span>
            </button>
            <div class="phoneApps">
              <button class="actBtn app" data-act="friends"><span class="ico" style="--c:#22c55e">👥</span><span class="appBadge hidden" id="friendBadge">0</span><span>Friends</span></button>
              <button class="actBtn app" data-act="dms"><span class="ico" style="--c:#3b82f6">💬</span><span class="appBadge hidden" id="dmBadge">0</span><span>Messages</span></button>
              <button class="actBtn app" data-act="announcements"><span class="ico" style="--c:#eab308">📣</span><span class="appBadge hidden" id="newsBadge">0</span><span>News</span></button>
              <button class="actBtn app" data-act="journey"><span class="ico" style="--c:#a78bfa">✦</span><span>Journey</span></button>
              <button class="actBtn app" data-act="notes"><span class="ico" style="--c:#facc15">📝</span><span>Notes</span></button>
              <button class="actBtn app" data-act="directory"><span class="ico" style="--c:#0ea5e9">🌐</span><span>Directory</span></button>
              <button class="actBtn app" data-act="map"><span class="ico" style="--c:#f97316">🗺️</span><span>Map</span></button>
              <button class="actBtn app" data-act="inv"><span class="ico" style="--c:#a855f7">🎒</span><span>Items</span></button>
              <button class="actBtn app" data-act="emotes" title="Emotes (G)"><span class="ico" style="--c:#84cc16">😀</span><span>Emotes</span></button>
              <button class="actBtn app" data-act="build"><span class="ico" style="--c:#14b8a6">🔨</span><span>Build</span></button>
              <button class="actBtn app" data-act="bugs" title="Report a bug"><span class="ico" style="--c:#ef4444">🐞</span><span>Report Bug</span></button>
              <button class="actBtn app staff hidden" id="btnStaff" data-act="staff" title="Staff panel"><span class="ico" style="--c:#fbbf24">🛡️</span><span>Staff</span></button>
              <button class="actBtn app" data-act="graphics" title="Boss cutscene quality"><span class="ico" style="--c:#8b5cf6">🎬</span><span>Graphics</span></button>
              <button class="actBtn app" data-act="help"><span class="ico" style="--c:#64748b">❓</span><span>Help</span></button>
            </div>
          </div>
          <div id="phoneAppView" class="hidden">
            <div class="phoneAppBar">
              <button id="phoneBack" title="Back">‹</button>
              <span id="spTitle">App</span>
            </div>
            <div id="spBody" class="phoneAppBody"></div>
          </div>
        </div>
        <button class="phoneHome" id="phoneHome" title="Put phone away (P)"></button>
      </div>
    </div>
    <button id="phoneTab" class="hidden" title="Phone (P)">📱</button>

    <!-- Build-mode banner -->
    <div id="buildBanner" class="hidden">
      <b>BUILD MODE</b> — drag to move • <b>R</b> rotate • right-click remove • ESC exit
      <button id="snapToggle" class="bannerBtn" title="Toggle snap-to-grid">grid: on</button>
    </div>

    <!-- Chat bubble input -->
    <div id="chatInput" class="hidden">
      <input id="chatBox" maxlength="80" placeholder="Say something... (Enter to send, ESC to cancel)" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" enterkeyhint="send" />
    </div>

    <!-- "Your client is out of date" — see the version check in js/net.js?v=asc-1 -->
    <div id="updateBanner" class="hidden">
      <span class="ubIcon">⚠️</span>
      <div class="ubText"><b>Update available</b><div id="ubDetail" class="ubDetail"></div></div>
      <button class="ubBtn" onclick="location.reload(true)">Reload</button>
      <button class="ubClose" title="Dismiss" onclick="document.getElementById('updateBanner').classList.add('hidden')">×</button>
    </div>

    <!-- Generic menu overlay -->
    <div id="menu" class="menuOverlay hidden">
      <div class="menuBox">
        <div class="menuHeader">
          <h2 id="menuTitle">Menu</h2>
          <button class="closeBtn" onclick="closeMenu()">×</button>
        </div>
        <div id="menuBody"></div>
      </div>
    </div>

    <!-- Toast notifications -->
    <div id="toast" class="hidden"></div>

    <!-- Notification bell (incoming friend req / duel / quest invite) -->
    <div id="notifyArea"></div>

    <!-- iMessage-style DM pop-ins (slide in from the top-left) -->
    <div id="msgPops"></div>

    <!-- Tutorial bubble -->
    <div id="tutorial" class="hidden">
      <div id="tutorialText"></div>
      <button id="tutorialNext">Next</button>
    </div>
   </div><!-- /stage -->

  <!-- Game dependencies yield between scripts; the title runs independently in a worker. -->
  <script>
  (function(){
   var tags=[].slice.call(document.querySelectorAll('script[data-boot]')),three=null,rest=[];
   tags.forEach(function(t){var src=t.getAttribute('src');if(/vendor\/three\.min\.js/.test(src))three=src;else rest.push(src);});
   rest.forEach(function(src){var l=document.createElement('link');l.rel='preload';l.as='script';l.href=src;l.fetchPriority='low';document.head.appendChild(l);});
   function load(src,high){return new Promise(function(ok,fail){var el=document.createElement('script');el.src=src;el.async=true;if(high)el.fetchPriority='high';el.onload=ok;el.onerror=function(){fail(new Error('Could not load '+src));};document.head.appendChild(el);});}
   var started=false,lastInput=-Infinity;
   document.addEventListener('input',function(e){if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName))lastInput=performance.now();},true);
   function inputTurn(ok){if(performance.now()-lastInput<250){setTimeout(function(){inputTurn(ok);},50);return;}ok();}
   function startGame(){
    if(started)return;started=true;
    // One script per task preserves dependency order and gives input/paint a turn between parses.
    var chain=Promise.resolve();rest.forEach(function(src){chain=chain.then(function(){return new Promise(function(ok){setTimeout(function(){inputTurn(ok);},16);});}).then(function(){return load(src,false);});});
    return chain;
   }
   window.__gameBoot=load(three,true).then(startGame);
   window.__gameBoot.catch(function(e){console.error('Game startup failed',e);});
   window.__titleBoot=load('js/neighborhood-title-background.js?v=nb-worker-1',true);
   window.__titleBoot.catch(function(e){console.warn('Optional login background unavailable',e);});
  })();
  </script>
