<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Neighborhood — Social Gambling House Game</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="screen">
    <div class="loginBox">
      <h1>NEIGHBORHOOD</h1>
      <p class="tagline">Build. Gamble. Socialize. Survive.</p>
      <input id="loginUser" placeholder="Username" maxlength="16" autocomplete="username" />
      <input id="loginPass" type="password" placeholder="Password" maxlength="32" autocomplete="current-password" />
      <div class="loginBtns">
        <button id="btnLogin">Log In</button>
        <button id="btnRegister">Register</button>
      </div>
      <div id="loginMsg" class="msg"></div>
      <div class="hint">Owners and admins get the Staff panel. Be nice — bans and mutes are real.</div>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="screen hidden">
   <div id="stage">
    <canvas id="game" width="1280" height="800"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="hudRow"><span id="hudName">—</span></div>
      <div class="hudRow"><span class="hudIcon money">$</span><span id="hudMoney">0</span></div>
      <div class="hudRow muted" id="hudBankRow" style="display:none;"><span class="hudIcon" style="background:#4ade80;color:#06210f">🏦</span><span id="hudBank">0</span></div>
      <div class="hudRow" id="hudDebtRow" style="display:none;color:#f87171;"><span class="hudIcon" style="background:#ef4444;color:#fff">!</span>owe <span id="hudDebt">0</span></div>
      <div class="hudRow"><span class="hudIcon hp">+</span><span id="hudHp">100</span></div>
      <div class="hudRow muted" id="hudArea">Neighborhood</div>
    </div>

    <!-- PHONE — the action bar lives on a GTA-style phone in the corner.
         Apps open INSIDE the phone screen (#phoneAppView); the ⤢ button blows
         the whole phone up to the middle of the screen and back. -->
    <div id="phone">
      <div class="phoneBody">
        <div class="phoneNotch"></div>
        <div class="phoneScreen">
          <div class="phoneStatus">
            <span class="sig">▂▄▆ NBHD</span>
            <span id="phoneClock">12:00</span>
            <span class="statRight">
              <button id="phoneExpand" title="Expand / shrink phone">⤢</button>
              <span class="bat">🔋</span>
            </span>
          </div>
          <div id="phoneHomeView">
            <div class="phoneHero">
              <div id="phoneBigClock">12:00</div>
              <div id="phoneDate">Tuesday</div>
            </div>
            <div class="phoneApps">
              <button class="actBtn app" data-act="friends"><span class="ico" style="--c:#22c55e">👥</span><span>Friends</span></button>
              <button class="actBtn app" data-act="dms"><span class="ico" style="--c:#3b82f6">💬</span><span>Messages</span></button>
              <button class="actBtn app" data-act="directory"><span class="ico" style="--c:#0ea5e9">🌐</span><span>Directory</span></button>
              <button class="actBtn app" data-act="map"><span class="ico" style="--c:#f97316">🗺️</span><span>Map</span></button>
              <button class="actBtn app" data-act="inv"><span class="ico" style="--c:#a855f7">🎒</span><span>Items</span></button>
              <button class="actBtn app" data-act="emotes" title="Emotes (G)"><span class="ico" style="--c:#eab308">😀</span><span>Emotes</span></button>
              <button class="actBtn app" data-act="build"><span class="ico" style="--c:#14b8a6">🔨</span><span>Build</span></button>
              <button class="actBtn app" data-act="bugs" title="Report a bug"><span class="ico" style="--c:#ef4444">🐞</span><span>Report Bug</span></button>
              <button class="actBtn app staff hidden" id="btnStaff" data-act="staff" title="Staff panel"><span class="ico" style="--c:#fbbf24">🛡️</span><span>Staff</span></button>
              <button class="actBtn app" data-act="help"><span class="ico" style="--c:#64748b">❓</span><span>Help</span></button>
            </div>
          </div>
          <div id="phoneAppView" class="hidden">
            <div class="phoneAppBar">
              <button id="phoneBack" title="Back">‹</button>
              <span id="spTitle">App</span>
            </div>
            <div id="spBody" class="phoneAppBody"></div>
          </div>
        </div>
        <button class="phoneHome" id="phoneHome" title="Put phone away (P)"></button>
      </div>
    </div>
    <button id="phoneTab" class="hidden" title="Phone (P)">📱</button>

    <!-- Build-mode banner -->
    <div id="buildBanner" class="hidden">
      <b>BUILD MODE</b> — drag to move • <b>R</b> rotate • right-click remove • ESC exit
      <button id="snapToggle" class="bannerBtn" title="Toggle snap-to-grid">grid: on</button>
    </div>

    <!-- Chat bubble input -->
    <div id="chatInput" class="hidden">
      <input id="chatBox" maxlength="80" placeholder="Say something... (Enter to send, ESC to cancel)" />
    </div>

    <!-- Generic menu overlay -->
    <div id="menu" class="menuOverlay hidden">
      <div class="menuBox">
        <div class="menuHeader">
          <h2 id="menuTitle">Menu</h2>
          <button class="closeBtn" onclick="closeMenu()">×</button>
        </div>
        <div id="menuBody"></div>
      </div>
    </div>

    <!-- Toast notifications -->
    <div id="toast" class="hidden"></div>

    <!-- Notification bell (incoming friend req / duel / quest invite) -->
    <div id="notifyArea"></div>

    <!-- iMessage-style DM pop-ins (slide in from the top-left) -->
    <div id="msgPops"></div>

    <!-- Tutorial bubble -->
    <div id="tutorial" class="hidden">
      <div id="tutorialText"></div>
      <button id="tutorialNext">Next</button>
    </div>
   </div><!-- /stage -->
  </div>

  <script src="js/net.js"></script>
  <script src="js/furniture.js"></script>
  <script src="js/shared/economy.js"></script>
  <script src="js/graphics.js"></script>
  <script src="js/core.js"></script>
  <script src="js/world.js"></script>
  <script src="js/scenery.js"></script>
  <script src="js/interiors.js"></script>
  <script src="js/casino.js"></script>
  <script src="js/jobs.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/social.js"></script>
  <script src="js/outdoor.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
